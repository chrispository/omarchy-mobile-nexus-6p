# Omarchy Mobile on the Nexus 6P: a critical battery powers the phone off.
# Suspend (s2idle) takes the USB link down with nothing yet to bring it back,
# so upower's default suspend at 2% left the phone unreachable until a Power
# press (nexus_linux_plan.md, 2026-10-18).
[UPower]
CriticalPowerAction=PowerOff
