# Modules udev would load for the angler's DT nodes that must wait for their
# own bring-up step (nexus_linux_plan.md N2):
# - mmcc-msm8994: multimedia clocks and GDSCs. The panel runs on the
#   bootloader's MDSS setup (simpledrm + fbkick); a clock driver taking over
#   could gate it.
# - ocmem: the GPU's on-chip memory, for the Adreno step.
# - rmtfs_mem: the modem's file-system memory, for the modem step.
blacklist mmcc_msm8994
blacklist ocmem
blacklist rmtfs_mem
