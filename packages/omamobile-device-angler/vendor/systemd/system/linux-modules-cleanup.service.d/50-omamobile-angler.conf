# SPDX-License-Identifier: MIT
# kernel-modules-hook moves every /usr/lib/modules/<release> that no package
# owns and isn't the running kernel to .old, and the next run loses it. The
# angler's kernels aren't packaged: booting a test kernel once took the
# everyday kernel's modules (charger, fuel gauge, firewall) with it.
[Unit]
ConditionPathExists=!/usr/share/omamobile/device-angler/version
